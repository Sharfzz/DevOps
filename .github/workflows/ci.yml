name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      # Step A: Download your code into the runner
      - name: Checkout code
        uses: actions/checkout@v4

        # Add the Snyk step here:
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # Step B: Install the programming language
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use your required version

      # Step C: Install your project's dependencies
      - name: Install dependencies
        run: npm ci

      # Step D: Run your automated tests
      - name: Run tests
        run: npm test

